name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Re-deploy daily so the contribution graph stays fresh
    - cron: '0 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Generates public/contributions.json; if it fails the site shows a fallback message
      - name: Fetch contributions
        run: node scripts/fetch-contributions.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_JVSOUZX }}
          GH_TOKEN_JVSOUZX: ${{ secrets.GH_TOKEN_JVSOUZX }}
          GH_TOKEN_INOVAMOBIL: ${{ secrets.GH_TOKEN_INOVAMOBIL }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
